name: Build ComfyAtmosphere with dense grass (x86)

# Builds a SEPARATE test DLL: ComfyAtmosphere v0.17.1-alpha + comfy/0001-dense-grass-copies.patch, 32-bit, MSVC.
# Nothing here touches a release DLL or an installation; the output is a workflow artifact to download and test by hand.
on:
  push:
    branches: [grass-assessment]
    paths:
      - 'comfy/**'
      - 'tools/**'
      - 'EqShaders/Presets/comfyatmos.ini'
      - '.github/workflows/comfy-dense-grass.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMFY_REPO: aloofbit/comfyatmosphere
  COMFY_TAG: v0.17.1-alpha
  COMFY_SHA: 73bebaaf2439aa17cc7766bb99bf8513f9aa6ade   # the commit the tag points to (the base of the patch)

jobs:
  build:
    runs-on: windows-2022          # Visual Studio 2022 (MSVC v143), pinned image, not windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings off (the patch is LF; the sources are LF)
        run: |
          git config --global core.autocrlf false
          mkdir -p logs

      - name: Checkout EqAzeroth
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          path: eq

      - name: Checkout ComfyAtmosphere at the pinned commit (with tags, for git describe)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          repository: ${{ env.COMFY_REPO }}
          ref: ${{ env.COMFY_SHA }}
          path: comfy-src
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify the pinned source
        run: |
          set -euo pipefail
          cd comfy-src
          tagsha=$(git rev-parse "refs/tags/${COMFY_TAG}^{commit}")
          head=$(git rev-parse HEAD)
          echo "tag ${COMFY_TAG} -> ${tagsha}; checked out ${head}; pinned ${COMFY_SHA}" | tee ../logs/source.log
          test "$tagsha" = "$COMFY_SHA" && test "$head" = "$COMFY_SHA"
          mkdir -p ../baseline && cp src/grass.cpp ../baseline/grass.cpp

      - name: Apply the dense-grass patch (must apply cleanly)
        run: |
          set -euo pipefail
          cd comfy-src
          git apply --check --verbose ../eq/comfy/0001-dense-grass-copies.patch 2>&1 | tee ../logs/patch.log
          git apply --verbose ../eq/comfy/0001-dense-grass-copies.patch 2>&1 | tee -a ../logs/patch.log
          git diff --stat | tee -a ../logs/patch.log
          echo "git describe (shown in the client report): $(git describe --tags --always --dirty)" | tee -a ../logs/patch.log

      - name: Config test (the dense-grass keys are read, clamped and applied by the real config.cpp)
        run: |
          set -euo pipefail
          cmake -S eq/comfy/tests -B build-test -A Win32 -DCOMFY_SRC="$PWD/comfy-src" 2>&1 | tee logs/config-test-configure.log
          cmake --build build-test --config Release 2>&1 | tee logs/config-test-build.log
          exe=$(find build-test -name grass_config_test.exe | head -1)
          python -I eq/tools/check_pe.py "$exe"
          "$exe" "eq/EqShaders/Presets/comfyatmos.ini" "comfy-src/comfyatmos.ini" 2>&1 | tee logs/config-test.log

      - name: Configure (32-bit, Win32)
        run: |
          set -euo pipefail
          cmake -S comfy-src -B build -A Win32 2>&1 | tee logs/cmake-configure.log

      - name: Build comfyatmos.dll (Release)
        run: |
          set -euo pipefail
          cmake --build build --config Release --verbose 2>&1 | tee logs/cmake-build.log
          dll=$(find comfy-src build -name comfyatmos.dll -not -path '*/CMakeFiles/*' | head -1)
          echo "built: $dll" | tee logs/dll-path.txt
          test -n "$dll"
          python -I eq/tools/check_pe.py "$dll" | tee logs/pe-check.log

      - name: Shader check with Microsoft D3DCompiler_47 (vs_2_0, both variants, limits, baseline identity)
        run: |
          set -euo pipefail
          python -I eq/tools/check_grass_vs.py comfy-src/src/grass.cpp --baseline baseline/grass.cpp --out shader-report 2>&1 | tee logs/shader-check.log

      - name: Compatibility with EqAzeroth's text patches (does not skip anything)
        run: |
          set -euo pipefail
          dll=$(sed -n 's/^built: //p' logs/dll-path.txt)
          python -I eq/tools/check_comfy_patches.py "$dll" --out patch-report --expect-grass 2>&1 | tee logs/patch-compat.log

      - name: Same patch scripts against the published release DLL (informational)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p release-dll && cd release-dll
          gh release download "$COMFY_TAG" -R "$COMFY_REPO" 2>&1 | tee ../logs/release-download.log
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done
          rel=$(find . -iname 'comfyatmos.dll' | head -1)
          echo "release dll: ${rel:-none}" | tee -a ../logs/release-download.log
          [ -n "$rel" ] && python -I ../eq/tools/check_comfy_patches.py "$rel" --out ../release-patch-report 2>&1 | tee ../logs/release-patch-compat.log

      - name: Package for testing (separate files, nothing is installed)
        run: |
          set -euo pipefail
          dll=$(sed -n 's/^built: //p' logs/dll-path.txt)
          mkdir -p dist
          cp "$dll" dist/comfyatmos.dense-grass.dll
          [ -f patch-report/comfyatmos.eqpatched.dll ] && cp patch-report/comfyatmos.eqpatched.dll dist/comfyatmos.dense-grass.eqpatched.dll
          cp eq/comfy/0001-dense-grass-copies.patch eq/comfy/INSTALL-TEST.txt dist/
          cp comfy-src/comfyatmos.ini dist/comfyatmos.dense-grass.example.ini
          cp -r shader-report dist/shader-report
          cp patch-report/patch-report.md dist/patch-report.md
          {
            echo "ComfyAtmosphere ${COMFY_TAG} (${COMFY_SHA}) + comfy/0001-dense-grass-copies.patch"
            echo "EqAzeroth commit: ${GITHUB_SHA}"
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-}"
            grep -h 'compiler identification' logs/cmake-configure.log || true
            cmake --version | head -1
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD-INFO.txt
          (cd dist && sha256sum *.dll *.patch | tee SHA256SUMS.txt)

      - name: Upload the test DLL package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: comfyatmos-dense-grass-x86
          path: dist/
          if-no-files-found: error

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: build-logs
          path: |
            logs/
            shader-report/
            patch-report/*.md
            release-patch-report/*.md
          if-no-files-found: warn
